name: API Automation + Allure Report

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v5

      # ==========================================================
      # JAVA
      # ==========================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # ==========================================================
      # INSTALL ALLURE CLI
      # ==========================================================

      - name: Install Allure CLI
        run: |
          curl -L \
            https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.zip \
            -o allure.zip

          unzip -q allure.zip

          mkdir -p "$HOME/.local"

          mv allure-2.29.0 "$HOME/.local/allure"

          echo "$HOME/.local/allure/bin" >> "$GITHUB_PATH"

          allure --version

      # ==========================================================
      # RUN MAVEN TESTS
      # ==========================================================

      - name: Run Maven tests
        run: |
          mvn -B clean test

      # ==========================================================
      # GENERATE ALLURE REPORT
      # ==========================================================

      - name: Generate Allure report
        if: always()
        run: |
          if [ -d target/allure-results ]; then
            allure generate target/allure-results \
              --clean \
              --single-file \
              -o target/allure-report
          else
            echo "No Allure results found."
            mkdir -p target/allure-report
            echo "No Allure results generated." > target/allure-report/README.txt
          fi

      # ==========================================================
      # GENERATE TEST SUMMARY
      # ==========================================================

      - name: Generate test summary
        if: always()
        run: |
          python scripts/generate_test_summary.py \
            target/allure-results \
            target/test-summary.json

      # ==========================================================
      # UPLOAD TEST SUMMARY
      # ==========================================================

      - name: Upload test summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-summary-run-${{ github.run_number }}
          path: target/test-summary.json
          retention-days: 7

      # ==========================================================
      # SEND EVENT TO POWER AUTOMATE
      # ==========================================================

      - name: Trigger Power Automate
        if: always()
        env:
          POWER_AUTOMATE_WEBHOOK_URL: ${{ secrets.POWER_AUTOMATE_WEBHOOK_URL }}
        run: |
          curl -X POST "$POWER_AUTOMATE_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{
              "event": "test_run_completed",
              "run_number": "${{ github.run_number }}",
              "run_attempt": "${{ github.run_attempt }}",
              "repository": "${{ github.repository }}",
              "branch": "${{ github.ref_name }}"
            }'

      # ==========================================================
      # UPLOAD ALLURE REPORT
      # ==========================================================

      - name: Upload Allure report artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: allure-report-run-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: target/allure-report
          retention-days: 7

      # ==========================================================
      # GITHUB PAGES
      # ==========================================================

      - name: Prepare GitHub Pages content
        if: always()
        run: |
          mkdir -p pages

          if [ -f target/test-summary.json ]; then
            cp target/test-summary.json pages/test-summary.json
          else
            echo '{"error":"test-summary.json not found"}' > pages/test-summary.json
          fi

      - name: Upload GitHub Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages

  # ==========================================================
  # DEPLOY TEST SUMMARY TO GITHUB PAGES
  # ==========================================================

  deploy-pages:
    runs-on: ubuntu-latest
    needs: run-tests

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy test summary to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4