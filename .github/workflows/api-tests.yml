name: API Automation + Allure Report

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Install Allure CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.zip
          unzip allure-2.29.0.zip
          sudo mv allure-2.29.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure

      - name: Run Maven tests
        run: |
          mvn -B clean test

      - name: Generate Allure report
        if: always()
        run: |
          if [ -d target/allure-results ]; then
            allure generate target/allure-results \
              --clean \
              --single-file \
              -o target/allure-report
          else
            echo "No Allure results found."
            mkdir -p target/allure-report
            echo "No Allure results generated." > target/allure-report/README.txt
          fi

      - name: Generate test summary
        if: always()
        run: |
          python scripts/generate_test_summary.py \
            target/allure-results \
            target/test-summary.json

      - name: Upload test summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-summary-run-${{ github.run_number }}
          path: target/test-summary.json
          retention-days: 7

      - name: Upload Allure report artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: allure-report-run-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: target/allure-report
          retention-days: 7

      # ==========================================================
      # GITHUB PAGES - PUBLISH TEST SUMMARY JSON
      # ==========================================================

      - name: Prepare GitHub Pages content
        if: always()
        run: |
          mkdir -p pages

          if [ -f target/test-summary.json ]; then
            cp target/test-summary.json pages/test-summary.json
          else
            echo '{"error":"test-summary.json not found"}' > pages/test-summary.json
          fi

      - name: Upload GitHub Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages

  # ==========================================================
  # DEPLOY TEST SUMMARY TO GITHUB PAGES
  # ==========================================================

  deploy-pages:
    runs-on: ubuntu-latest
    needs: run-tests

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy test summary to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4